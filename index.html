<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Store</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Product Store</h1>
            <button id="createProductBtn" class="btn">Create New Product</button>
        </div>
    </div>

    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeModalBtn">X</span>
            <h2 id="modalTitle">Create a New Product</h2>
            <label for="productName">Product Name</label>
            <input id="productName" name="productName" type="text" />
            <label for="productPrice">Product Price</label>
            <input id="productPrice" name="productPrice" type="number" />
            <label for="productDescription">Product Description</label>
            <textarea id="productDescription" name="productDescription"></textarea>
            <label for="productImage">Product Image</label>
            <input id="productImage" name="productImage" type="text" />
            <button id="modalBtn" class="btn">Create Product</button>
        </div>
    </div>

    <div id="productList" class="container"></div>

    <template id="productCardTemplate">
        <div class="product-card">
            <img src="" alt="" />
            <h3></h3>
            <p class="description"></p>
            <p class="price"></p>
            <div class="card-buttons">
                <button class="edit-btn">Edit</button>
                <button class="delete-btn">Delete</button>
            </div>
        </div>
    </template>
</body>
</html>
